<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        .stat-label {
            color: #666;
            font-size: 1.1em;
        }
        .tabs {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
            border-radius: 8px 8px 0 0;
        }
        .tab-btn:hover {
            background: #f5f5f5;
        }
        .tab-btn.active {
            color: #667eea;
            background: #f0f4ff;
            font-weight: bold;
            border-bottom: 3px solid #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table th {
            background: #f5f5f5;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        table tr:hover {
            background: #f9f9f9;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            transform: scale(1.05);
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .plate-number {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍💼 Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDetections">-</div>
                <div class="stat-label">Total Detections</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalStolen">-</div>
                <div class="stat-label">Stolen Vehicles</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalFound">-</div>
                <div class="stat-label">Found Vehicles</div>
            </div>
        </div>

        <!-- Tabs Section -->
        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('users')">Users</button>
                <button class="tab-btn" onclick="showTab('stolen')">Stolen Vehicles</button>
                <button class="tab-btn" onclick="showTab('found')">Found Vehicles</button>
                <button class="tab-btn" onclick="showTab('detections')">All Detections</button>
            </div>

            <!-- Users Tab -->
            <div id="users-tab" class="tab-content active">
                <h2 style="color: #667eea; margin-bottom: 20px;">Registered Users</h2>
                <div id="usersContent" class="loading">Loading...</div>
            </div>

            <!-- Stolen Vehicles Tab -->
            <div id="stolen-tab" class="tab-content">
                <h2 style="color: #667eea; margin-bottom: 20px;">Stolen Vehicles</h2>
                <div id="stolenContent" class="loading">Loading...</div>
            </div>

            <!-- Found Vehicles Tab -->
            <div id="found-tab" class="tab-content">
                <h2 style="color: #667eea; margin-bottom: 20px;">Found Vehicles</h2>
                <div id="foundContent" class="loading">Loading...</div>
            </div>

            <!-- All Detections Tab -->
            <div id="detections-tab" class="tab-content">
                <h2 style="color: #667eea; margin-bottom: 20px;">All Detections</h2>
                <div id="detectionsContent" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // Load data when page loads
        window.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadUsers();
        });

        // Load statistics
        async function loadStatistics() {
            try {
                const response = await fetch('/api/admin/statistics');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.statistics.total_users;
                    document.getElementById('totalDetections').textContent = data.statistics.total_detections;
                    document.getElementById('totalStolen').textContent = data.statistics.total_stolen;
                    document.getElementById('totalFound').textContent = data.statistics.total_found;
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();
                
                const content = document.getElementById('usersContent');
                
                if (data.success && data.users.length > 0) {
                    let html = '<table><thead><tr><th>Username</th><th>Role</th><th>Registered At</th></tr></thead><tbody>';
                    
                    data.users.forEach(user => {
                        html += `
                            <tr>
                                <td>${user.username}</td>
                                <td>${user.role}</td>
                                <td>${new Date(user.created_at).toLocaleString()}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="no-data">No users found</div>';
                }
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersContent').innerHTML = '<div class="no-data">Error loading users</div>';
            }
        }

        // Load stolen vehicles
        async function loadStolen() {
            try {
                const response = await fetch('/api/admin/stolen-vehicles');
                const data = await response.json();
                
                const content = document.getElementById('stolenContent');
                
                if (data.success && data.stolen_vehicles.length > 0) {
                    let html = '<table><thead><tr><th>Plate Number</th><th>Owner</th><th>Contact</th><th>Vehicle Info</th><th>Reported At</th><th>Action</th></tr></thead><tbody>';
                    
                    data.stolen_vehicles.forEach(vehicle => {
                        html += `
                            <tr>
                                <td class="plate-number">${vehicle.plate_number}</td>
                                <td>${vehicle.owner_name || 'N/A'}</td>
                                <td>${vehicle.contact || 'N/A'}</td>
                                <td>${vehicle.vehicle_info || 'N/A'}</td>
                                <td>${new Date(vehicle.reported_at).toLocaleString()}</td>
                                <td><button class="btn btn-success" onclick="markFound('${vehicle._id}')">Mark as Found</button></td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="no-data">No stolen vehicles reported</div>';
                }
            } catch (error) {
                console.error('Error loading stolen vehicles:', error);
                document.getElementById('stolenContent').innerHTML = '<div class="no-data">Error loading data</div>';
            }
        }

        // Load found vehicles
        async function loadFound() {
            try {
                const response = await fetch('/api/admin/found-vehicles');
                const data = await response.json();
                
                const content = document.getElementById('foundContent');
                
                if (data.success && data.found_vehicles.length > 0) {
                    let html = '<table><thead><tr><th>Plate Number</th><th>Owner</th><th>Found At</th></tr></thead><tbody>';
                    
                    data.found_vehicles.forEach(vehicle => {
                        html += `
                            <tr>
                                <td class="plate-number">${vehicle.plate_number}</td>
                                <td>${vehicle.owner_name || 'N/A'}</td>
                                <td>${new Date(vehicle.found_at).toLocaleString()}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="no-data">No found vehicles yet</div>';
                }
            } catch (error) {
                console.error('Error loading found vehicles:', error);
                document.getElementById('foundContent').innerHTML = '<div class="no-data">Error loading data</div>';
            }
        }

        // Load all detections
        async function loadDetections() {
            try {
                const response = await fetch('/api/admin/detections');
                const data = await response.json();
                
                const content = document.getElementById('detectionsContent');
                
                if (data.success && data.detections.length > 0) {
                    let html = '<table><thead><tr><th>Plate Number</th><th>Confidence</th><th>Detected At</th><th>Source</th></tr></thead><tbody>';
                    
                    data.detections.forEach(detection => {
                        html += `
                            <tr>
                                <td class="plate-number">${detection.plate_number}</td>
                                <td>${(detection.confidence * 100).toFixed(2)}%</td>
                                <td>${new Date(detection.detected_at).toLocaleString()}</td>
                                <td>${detection.source_image || detection.source_video || 'N/A'}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<div class="no-data">No detections yet</div>';
                }
            } catch (error) {
                console.error('Error loading detections:', error);
                document.getElementById('detectionsContent').innerHTML = '<div class="no-data">Error loading data</div>';
            }
        }

        // Mark vehicle as found
        async function markFound(vehicleId) {
            if (!confirm('Mark this vehicle as found?')) return;
            
            try {
                const response = await fetch(`/api/admin/mark-found/${vehicleId}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('Vehicle marked as found!');
                    loadStatistics();
                    loadStolen();
                    loadFound();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error);
            }
        }

        // Show selected tab
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');

            // Load data for selected tab
            if (tabName === 'users') {
                loadUsers();
            } else if (tabName === 'stolen') {
                loadStolen();
            } else if (tabName === 'found') {
                loadFound();
            } else if (tabName === 'detections') {
                loadDetections();
            }
        }

        // Logout function
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
